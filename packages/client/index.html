<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoidWorks</title>
    
    <link rel="icon" href="data:;base64,=">
    
    </head>
<body>
    <div id="ui-layer">
        
        <div id="stats-panel">
            <div class="bar-container">
                <div id="health-bar" class="bar-fill" style="width: 100%; background: #e74c3c;"></div>
                <span class="bar-text">HP</span>
            </div>
            <div class="bar-container">
                <div id="oxygen-bar" class="bar-fill" style="width: 100%; background: #3498db;"></div>
                <span class="bar-text">O2</span>
            </div>
            <div id="debug-info" style="margin-top:5px; font-size:12px; color:#aaa;">FPS: 60</div>
        </div>

        <div id="interaction-prompt" class="hidden">Press F to Interact</div>

        <div id="hotbar-container"></div>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
