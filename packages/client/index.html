<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VoidWorks</title>
  </head>
  <body>
    <div id="ui-layer">
        <div id="stats-panel">
            <div class="stat-row">
                <span>HP:</span>
                <div class="bar-container">
                    <div id="hp-bar" class="bar"></div>
                </div>
            </div>
            <div class="stat-row">
                <span>O2:</span>
                <div class="bar-container">
                    <div id="oxygen-bar" class="bar"></div>
                </div>
            </div>
            <div id="debug-info"></div>
        </div>

        <div id="interaction-prompt">Press E to interact</div>

        <div id="hotbar-container"></div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
