syntax = "proto3";

package voidworks;

message ClientPacket {
    oneof packet {
        Handshake handshake = 1;
        InputData input = 2;
        BuildRequest build = 3;
        CraftRequest craft = 4;
        RequestChunk requestChunk = 5;
    }
}

message ServerPacket {
    oneof packet {
        WelcomePacket welcome = 1;
        // MapData mapData = 2; // [棄用] 舊的全地圖封包
        WorldState worldState = 3;
        InventoryUpdate inventory = 4;
        ChunkData chunkData = 5;
    }
}

message Handshake {
    string name = 1;
}

message WelcomePacket {
    string playerId = 1;
}

message InputData {
    bool up = 1;
    bool down = 2;
    bool left = 3;
    bool right = 4;
    float mouseAngle = 5;
    bool isShooting = 6;
    int32 selectedSlot = 7;
}

message BuildRequest {
    int32 type = 1;
    float x = 2;
    float y = 3;
    float angle = 4;
}

message CraftRequest {
    int32 recipeId = 1;
}

message RequestChunk {
    int32 chunkX = 1;
    int32 chunkY = 2;
}

message ChunkData {
    int32 chunkX = 1;
    int32 chunkY = 2;
    repeated int32 tiles = 3; // 32x32 的一維陣列
}

message WorldState {
    float time = 1;
    repeated EntityData entities = 2;
}

message EntityData {
    string id = 1;
    int32 type = 2;
    float x = 3;
    float y = 4;
    float angle = 5;
    float health = 6;
    float maxHealth = 7;
    string name = 8;
    float oxygen = 9;
    float maxOxygen = 10;
}

message InventoryUpdate {
    map<int32, int32> items = 1;
}